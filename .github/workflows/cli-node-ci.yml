name: CLI Node CI

# On PRs this is invoked by ci-gate.yml (the single required check);
# push-to-main and manual runs remain standalone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cli/node/**'
      - '.github/workflows/cli-node-ci.yml'
  workflow_call:

jobs:
  contract:
    name: CLI payload contract check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Python and Node CLI contract files are in sync
        run: make contract-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: cli/node/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: cli/node
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: make lint-node-cli

      - name: Type check
        run: make typecheck-node-cli

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: cli/node/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: cli/node
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: make test-node-cli

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: cli/node/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: cli/node
        run: pnpm install --frozen-lockfile

      - name: Build
        run: make build-node-cli

      - name: Verify dist output
        run: |
          test -f cli/node/dist/index.js || (echo "Build output missing: dist/index.js" && exit 1)
