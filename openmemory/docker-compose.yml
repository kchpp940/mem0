name: openmemory

services:
  mem0_store:
    image: qdrant/qdrant
    ports:
      - "${QDRANT_EXPOSE_PORT:-6333}:6333"
    volumes:
      - mem0_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  openmemory-mcp:
    image: mem0/openmemory-mcp
    build: api/
    environment:
      USER: ${MEM0_USER_ID:-${USER:-default_user}}
      MEM0_USER_ID: ${MEM0_USER_ID:-${USER:-default_user}}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      VECTOR_STORE_PROVIDER: ${VECTOR_STORE_PROVIDER:-qdrant}
      QDRANT_HOST: mem0_store
      QDRANT_PORT: "6333"
    env_file:
      - ../.env
      - ./api/.env
    depends_on:
      mem0_store:
        condition: service_healthy
    ports:
      - "${OPENMEMORY_API_PORT:-8765}:8765"
    volumes:
      - ./api:/usr/src/openmemory
    entrypoint: ["python", "./entrypoint.py", "--service", "openmemory-api", "--run-migrations", "--"]
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8765", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; print(urllib.request.urlopen('http://localhost:8765/health', timeout=3).read())"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  openmemory-ui:
    build:
      context: ui/
      dockerfile: Dockerfile
    image: mem0/openmemory-ui:latest
    ports:
      - "${OPENMEMORY_UI_PORT:-3001}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8765}
      NEXT_PUBLIC_USER_ID: ${MEM0_USER_ID:-${USER:-default_user}}
      API_INTERNAL_URL: http://openmemory-mcp:8765
    depends_on:
      openmemory-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mem0_storage:
