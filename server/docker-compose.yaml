name: mem0-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: on-failure
    shm_size: "128mb"
    networks:
      - mem0_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy ../.env.example to ../.env and set it.}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d ${POSTGRES_DB:-postgres} -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_db:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "${POSTGRES_EXPOSE_PORT:-8432}:5432"

  mem0:
    build:
      context: ..
      dockerfile: server/dev.Dockerfile
    ports:
      - "${MEM0_SERVER_PORT:-8888}:8000"
    env_file:
      - ../.env
      - ./.env
    networks:
      - mem0_network
    volumes:
      - ./history:/app/history
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["python", "./entrypoint.py", "--service", "server", "--run-migrations", "--"]
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ""
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
      MEM0_APP_DB_NAME: ${MEM0_APP_DB_NAME:-mem0_app}
      APP_DB_NAME: ${MEM0_APP_DB_NAME:-mem0_app}
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      MEM0_TELEMETRY: ${MEM0_TELEMETRY:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health', timeout=3).read())"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mem0-dashboard:
    build: ./dashboard
    ports:
      - "${MEM0_DASHBOARD_PORT:-3000}:3000"
    networks:
      - mem0_network
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_MEM0_API_URL:-http://localhost:8888}
      API_INTERNAL_URL: http://mem0:8000
      NEXT_PUBLIC_INSTANCE_NAME: ${NEXT_PUBLIC_INSTANCE_NAME:-Mem0}
    depends_on:
      mem0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_db:

networks:
  mem0_network:
    driver: bridge
